{% extends "base.html" %}
{% block title %}Edit Event — CampusEvents{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="form-card">
            <h3 class="section-title mb-4">Edit Event</h3>
            <form method="POST" enctype="multipart/form-data" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="name">Event Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ event.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="category">Category *</label>
                        <select class="form-select" id="category" name="category" required>
                            {% for cat in ["Technical", "Cultural", "Sports", "Workshop", "Seminar", "Fest", "Hackathon", "Other"] %}
                            <option value="{{ cat }}" {% if event.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="description">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required>{{ event.description }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="venue">Venue *</label>
                        <input type="text" class="form-control" id="venue" name="venue" value="{{ event.venue }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="organizer">Organizer Name *</label>
                        <input type="text" class="form-control" id="organizer" name="organizer" value="{{ event.organizer }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="date">Date *</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{ event.date.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="time">Time *</label>
                        <input type="time" class="form-control" id="time" name="time" value="{{ event.time.strftime('%H:%M') }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label" for="image">Event Image</label>
                        {% if event.image_filename %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/' + event.image_filename) }}" class="img-fluid rounded" style="max-height:120px;">
                        </div>
                        {% endif %}
                        <input type="file" class="form-control" id="image" name="image" accept=".png,.jpg,.jpeg,.gif,.webp">
                        <div class="form-text">Leave empty to keep the current image.</div>
                        <img id="imagePreview" src="#" alt="Preview" class="img-fluid rounded mt-2 d-none" style="max-height:150px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="registration_link">Registration Link (optional)</label>
                        <input type="url" class="form-control" id="registration_link" name="registration_link" placeholder="https://..." value="{{ event.registration_link or '' }}">
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Changes</button>
                    <a href="{{ url_for('event_details', event_id=event.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
