{% extends "base.html" %}
{% block title %}Sign Up — CampusEvents{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card">
            <h3 class="text-center mb-1"><i class="bi bi-person-plus-fill text-primary"></i></h3>
            <h3 class="text-center section-title d-inline-block mb-4">Create your account</h3>
            <form method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Full Name</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
            <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
